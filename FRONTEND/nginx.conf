# 1. Force all unsecure HTTP traffic to secure HTTPS
server {
    listen 80;
    server_name maslecodes.fun www.maslecodes.fun;
    return 301 https://$host$request_uri;
}

# 2. The Secure HTTPS Server
server {
    listen 443 ssl;
    server_name maslecodes.fun www.maslecodes.fun;

    # Point to the Certbot certificates on your host server
    ssl_certificate /etc/letsencrypt/live/maslecodes.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maslecodes.fun/privkey.pem;

    # Route A: Serve the React App (Handles React Router properly)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Route B: Reverse Proxy the API to the Node.js Backend Container
    # Removed websocket upgrade headers since you are using standard HTTP polling
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}