# RPL: frontend (Nginx + React), backend (Node API), MongoDB and Redis.
# Values come from .env next to this file (copy .env.example to .env).
#
#   docker compose up -d --build
#
# Security:
# - Only the frontend is published, and only on 127.0.0.1 (the server's Nginx forwards to it).
# - Backend, MongoDB and Redis publish NO ports: nothing outside this server can reach them.
# - MongoDB and Redis sit on an internal network and both require a password.

services:
  mongodb:
    # mongo:5+ needs a CPU with AVX; this server doesn't have it, so 4.4 is the default
    image: ${MONGO_IMAGE:-mongo:4.4}
    container_name: rpl_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks: [db] # no "ports:" on purpose
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || mongo --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: rpl_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks: [db] # no "ports:" on purpose
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./BACKEND
    container_name: rpl_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/cricket_engine?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # player photos survive rebuilds
      - uploads_data:/app/uploads
    networks: [web, db] # no "ports:" on purpose

  frontend:
    build: ./FRONTEND
    container_name: rpl_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # localhost only: the server's Nginx forwards cricket.maslecodes.fun here
      - "127.0.0.1:${APP_PORT:-8004}:80"
    networks: [web]

networks:
  web: {}
  db:
    internal: true # no route to or from the outside world

volumes:
  mongodb_data:
  redis_data:
  uploads_data:
